plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	// Репозиторий CaffeineMC — стабильный Sodium 0.8.13+mc1.21.11 (совместим с Iris 1.10.7)
	maven {
		name = "CaffeineMC"
		url = "https://maven.caffeinemc.net/releases"
	}
}

loom {
	accessWidenerPath = file("src/main/resources/fluxvisuals.accesswidener")
	mods {
		"fluxvisuals" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Стабильный Sodium 0.8.13+mc1.21.11 (совместим с Iris 1.10.7; 0.8.14-beta ломает его).
	// compileOnly — jar кладёт сам лоадер в game/mods, в мод не бандлим.
	modCompileOnly "net.caffeinemc:sodium-fabric:0.8.13+mc1.21.11"

	// Figura + LuaJ — встроены через JAR-in-JAR (JIJ)
	modImplementation fileTree(dir: 'src/main/resources/META-INF/jars', include: ['*.jar'])

	// JNA — для Discord Rich Presence (JNI)
	implementation "net.java.dev.jna:jna:5.15.0"
	implementation "net.java.dev.jna:jna-platform:5.15.0"

	// WebSocket — для AuthWebSocketClient
	implementation "org.java-websocket:Java-WebSocket:1.5.7"

	// --- Зависимости исходного ClickGui (из expensivesrc/build.gradle) ---
	implementation "org.json:json:20240303"
	implementation "com.squareup.okhttp3:okhttp:4.12.0"
	implementation "com.squareup.retrofit2:retrofit:2.11.0"
	implementation "com.squareup.retrofit2:converter-gson:2.11.0"
	implementation "org.springframework:spring-websocket:6.1.13"
	implementation "com.formdev:svgSalamander:1.1.4"

	// Внешние библиотеки ClickGUI должны быть в jar: implementation их только компилирует.
	// Без include классы okhttp3/retrofit2/etc. отсутствуют в рантайме и мод падает на старте.
	include "com.squareup.okhttp3:okhttp:4.12.0"
	include "com.squareup.okio:okio-jvm:3.6.0"
	include "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
	include "com.squareup.retrofit2:retrofit:2.11.0"
	include "com.squareup.retrofit2:converter-gson:2.11.0"
	include "org.java-websocket:Java-WebSocket:1.5.7"
	include "net.java.dev.jna:jna:5.15.0"
	include "net.java.dev.jna:jna-platform:5.15.0"

	compileOnly "org.projectlombok:lombok:1.18.38"
	annotationProcessor "org.projectlombok:lombok:1.18.38"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	archiveBaseName.set(project.archives_base_name)

	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}

// ---- Обфускация финального jar (Grunteon 3, CLI) ----
// Берёт remapped jar, переименовывает классы/методы/поля и обновляет entrypoints
// в fabric.mod.json. Исключения (Gson-модели, миксины, reflection) — в grunteon-config.json.
tasks.register('obfuscateJar', JavaExec) {
	dependsOn remapJar

	def outDir = layout.buildDirectory.dir("release")
	def outJar = layout.buildDirectory.file("release/${archives_base_name}-${project.version}.jar")
	def configFile = layout.buildDirectory.file('tmp/grunteon-config.json')

	// Grunteon 3 требует JDK 25. Пути можно переопределить:
	//   -PgrunteonJar=... -PgrunteonJava=...
	// По умолчанию берём JAR с Рабочего стола и java из PATH.
	def grunteonJarPath = project.findProperty('grunteonJar')
		?: System.getenv('GRUNTEON_JAR')
		?: new File(System.getProperty('user.home'), 'Desktop/Grunteon-3.0.0.260621.jar').absolutePath
	def grunteonJava = project.findProperty('grunteonJava') ?: System.getenv('GRUNTEON_JAVA') ?: 'java'
	def grunteonXmx = project.findProperty('grunteonXmx') ?: '1536m'

	classpath = files(grunteonJarPath)
	mainClass = 'net.spartanb312.grunteon.obfuscator.MainKt'
	executable = grunteonJava
	jvmArgs '--enable-native-access=ALL-UNNAMED', "-Xmx${grunteonXmx}"
	args '--config', configFile.get().asFile.absolutePath

	doFirst {
		if (!file(grunteonJarPath).isFile()) {
			throw new GradleException("Grunteon JAR not found: ${grunteonJarPath}. Pass -PgrunteonJar=<path> or set GRUNTEON_JAR")
		}

		// Grunteon читает только intermediary-jar Minecraft. Подключение всего
		// runtimeClasspath (десятки тысяч классов) упирается в лимит памяти JVM.
		def libs = []
		def loomMcDir = new File(gradle.gradleUserHomeDir,
			'caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-intermediary')
		if (loomMcDir.isDirectory()) {
			def candidates = fileTree(dir: loomMcDir, include: '**/*.jar').files.findAll {
				it.name.contains(project.minecraft_version as String)
			}
			def mcJar = candidates.find { it.name.endsWith('-v2.jar') } ?: (candidates ? candidates[0] : null)
			if (mcJar != null) libs << mcJar.absolutePath.replace('\\', '/')
		}
		def customMcJar = project.findProperty('grunteonMinecraftJar')
		if (customMcJar != null) libs << file(customMcJar).absolutePath.replace('\\', '/')

		def json = groovy.json.JsonOutput
		def configText = file('grunteon-config.json').text
			.replace('__INPUT__', remapJar.archiveFile.get().asFile.absolutePath.replace('\\', '/'))
			.replace('__OUTPUT__', outJar.get().asFile.absolutePath.replace('\\', '/'))
			.replace('__LIBS__', json.toJson(libs))

		def config = configFile.get().asFile
		config.parentFile.mkdirs()
		config.text = configText
	}

	inputs.file(remapJar.archiveFile)
	inputs.files(file('grunteon-config.json'))
	outputs.dir(outDir)

	// Относительные пути внутри конфига считаются от CWD процесса.
	workingDir = projectDir
}

tasks.register('printCpc') {
    doLast {
        println configurations.compileClasspath.asPath
    }
}

task printClasspath {
    doLast {
        configurations.compileClasspath.files.each { println it.absolutePath }
    }
}
